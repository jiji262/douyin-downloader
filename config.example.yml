link:
  - https://www.douyin.com/user/MS4wLjABAAAA6O7EZyfDRYXxJrUTpf91K3tmB4rBROkAw-nYMfld8ss

path: ./Downloaded/

# 是否下载视频文件；关闭后仍可按下方开关保存原始封面、音乐、头像或 JSON。
# 默认只保存视频本体，其余附带产物按需打开。
video: true
music: false
cover: false
avatar: false
json: false

start_time: ""
end_time: ""

folderstyle: true

# 文件/目录命名模板。可用变量：
#   {id} {title} {author} {author_id} {date} {year} {month} {day}
#   {time} {timestamp} {type} {mode}
# 要求模板中至少包含 {id} 以避免重名覆盖。
filename_template: "{date}_{title}_{id}"
folder_template: "{date}_{title}_{id}"

# 作者目录层命名方式。可选值：
#   nickname     - 仅作者昵称（默认，最直观，但重名会合并、改名会分裂）
#   sec_uid      - 作者 sec_uid（稳定唯一，但不直观）
#   nickname_uid - 昵称_sec_uid（直观 + 唯一，推荐重度用户）
# 切换只影响后续下载，不会迁移已存在的目录。
author_dir: "nickname"

# 是否按下载模式再分一层（post / like / collect …）。默认 true。
# 日更生产面（favorites → G:\media\douyin）强制 false：
#   → <原作者>/{date}_{title}_{id}/（无 collect 层）。见 config.automation.yml / LOCAL_SETUP.md
# group_by_mode: true

# collect / collectmix：顶层用作品原作者目录（默认 true，对齐 Douzy）。
# false 则落在收藏夹主人占位名 self/collect/…。日更保持 true。
# collect_use_aweme_author_dir: true

# 默认不下载作者主页置顶作品；如需包含置顶，改为 true
download_pinned: false

# 下载博主作品时，在作者根目录覆盖保存一张主页首屏截图
homepage_screenshot: false

mode:
  - post

number:
  post: 1
  like: 0
  allmix: 0
  mix: 0
  music: 0
  collect: 0
  collectmix: 0

increase:
  post: false
  like: false
  allmix: false
  mix: false
  music: false

thread: 5
retry_times: 3
proxy: ""
database: true
database_path: dy_downloader.db

# 视频下载画质。抖音 API 为每个视频返回多档码率，此选项决定选用哪一档：
#   highest                  - 最高画质（默认）：先探测上传原片（转码档列表
#                              之外，可比最高转码档大数倍），比转码档大则
#                              优先下载原片，探测失败时退回最高转码档
#   lowest                   - 最低可用档（省流量）
#   1440p / 1080p / 720p / 540p / 480p / 360p
#                            - 指定分辨率，匹配不到时自动降级到最接近的可用档
# 实际可用档位取决于原视频上传质量。
video_quality: highest

progress:
  quiet_logs: true

# Douzy / 桌面内置转写。生产日更保持 enabled: false；转写走下方 mcp_transcript。
transcript:
  enabled: false
  model: gpt-4o-mini-transcribe
  output_dir: ""
  response_formats:
    - txt
    - json
  api_url: https://api.openai.com/v1/audio/transcriptions
  api_key_env: OPENAI_API_KEY
  api_key: ""

# 生产转写（CLI）：下载后直调 MCP extract_text（库/CLI，非 :8080），写旁侧 .transcript.txt
# 并追加 G:\media\douyin\_factory。日更由 config.automation.yml 打开；密钥用 DOUYIN_API_KEY。
# 说明见 LOCAL_SETUP.md；存量补跑：tools/run_mcp_transcript.py
# mcp_transcript:
#   enabled: false
#   api_key_env: DOUYIN_API_KEY
#   mcp_scripts_path: D:\dev\github\douyin-mcp-server\douyin-video\scripts
#   mcp_python: D:\dev\github\douyin-mcp-server\.venv\Scripts\python.exe
#   timeout_seconds: 600
#   prefer_local_video: true  # local mp4 ASR first; share URL is fallback only

browser_fallback:
  enabled: true
  headless: false
  max_scrolls: 240
  idle_rounds: 8
  wait_timeout_seconds: 600

# 评论采集（可选）：启用后每个作品会额外生成 *_comments.json
comments:
  enabled: false
  include_replies: false
  max_comments: 0   # 0 = 不限
  page_size: 20

# 直播录制（可选）：当 link 指向 live.douyin.com/{room_id} 或 /follow/live/{room_id} 时生效
live:
  max_duration_seconds: 0   # 0 = 录到主播下播
  chunk_size: 65536
  idle_timeout_seconds: 30

# 下载完成通知（可选）。providers 支持 bark / telegram / webhook
notifications:
  enabled: false
  on_success: true
  on_failure: true
  providers: []
  # 示例：
  # providers:
  #   - type: bark
  #     url: https://api.day.app/YOUR_DEVICE_KEY
  #     sound: bell
  #   - type: telegram
  #     bot_token: "123456:ABC..."
  #     chat_id: "987654321"
  #   - type: webhook
  #     url: https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxx
  #     extra_body:
  #       msgtype: text

# REST API 服务模式（可选，需额外安装 fastapi + uvicorn）
server:
  max_jobs: 500
  job_ttl_seconds: 86400   # 完成态 job 保留 24 小时

cookies:
  msToken: YOUR_MS_TOKEN
  ttwid: YOUR_TTWID
  odin_tt: YOUR_ODIN_TT
  passport_csrf_token: YOUR_CSRF_TOKEN
  sid_guard: YOUR_SID_GUARD
